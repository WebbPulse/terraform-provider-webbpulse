name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag whose tag-run build is re-signed and uploaded to the registry
        required: true
        type: string
      environment:
        description: Registry environment whose key signs the build and whose bucket receives it
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.environment || 'tag' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the signing environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick the environment from the tag
        id: pick
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          CHOSEN: ${{ inputs.environment }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semantic version tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$CHOSEN" ]; then
            echo "environment=$CHOSEN" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, sign and publish
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      SIGNING_KMS_KEY_ID: ${{ vars.SIGNING_KMS_KEY_ID }}
      PARAMETER_PREFIX: ${{ vars.SIGNING_KEY_PARAMETER_PREFIX }}
      KEY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      TAG: ${{ needs.resolve.outputs.tag }}
      GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
      UPLOAD_BUCKET: ${{ vars.REGISTRY_UPLOAD_BUCKET }}
      UPLOAD_KMS_KEY_ARN: ${{ vars.REGISTRY_UPLOAD_KMS_KEY_ARN }}
      BUILD_ARTIFACT: provider-build-${{ needs.resolve.outputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        id: commit
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The checked out commit is not the commit ${TAG} points at"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::${TAG} points at ${commit}, which is not on main. Merge it to main and tag the merge commit."
            exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check out the signer from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: signer-src
          persist-credentials: false

      - name: Build the KMS signer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          (cd signer-src && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/kms-openpgp" ./cmd/kms-openpgp)
          rm -rf signer-src
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Fetch the build the tag run published
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="terraform-provider-webbpulse_${TAG#v}"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&branch=${TAG}&head_sha=${COMMIT}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful tag run of release.yml built ${TAG} at ${COMMIT}. Push the tag first."
            exit 1
          fi
          mkdir -p dist
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$BUILD_ARTIFACT" --dir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${prefix}_SHA256SUMS" --output "$RUNNER_TEMP/release_SHA256SUMS"
          if ! cmp --silent "$RUNNER_TEMP/release_SHA256SUMS" "dist/${prefix}_SHA256SUMS"; then
            echo "::error::The GitHub release checksums for ${TAG} differ from the build run ${run_id} produced"
            exit 1
          fi
          rm -f "dist/${prefix}_SHA256SUMS.sig"
          (cd dist && sha256sum --check --strict "${prefix}_SHA256SUMS")
          echo "Promoting the build from run ${run_id}" >> "$GITHUB_STEP_SUMMARY"

      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.SIGNING_KEY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Publish the KMS public key
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KMS_KEY_ID" ] || [ -z "$PARAMETER_PREFIX" ]; then
            echo "::error::Set SIGNING_KMS_KEY_ID and SIGNING_KEY_PARAMETER_PREFIX on the ${KEY_ENVIRONMENT} environment"
            exit 1
          fi
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          certificate="$RUNNER_TEMP/public.asc"
          key_id="$(kms-openpgp public-key -key "$SIGNING_KMS_KEY_ID" -name "WebbPulse Terraform provider ${KEY_ENVIRONMENT}" -email tyler@webbpulse.com -output "$certificate")"
          published_key="$(aws ssm get-parameter --name "$PARAMETER_PREFIX/public-key" --query Parameter.Value --output text)"
          published_id="$(aws ssm get-parameter --name "$PARAMETER_PREFIX/key-id" --query Parameter.Value --output text)"
          if [ "$published_key" != "$(cat "$certificate")" ] || [ "$published_id" != "$key_id" ]; then
            aws ssm put-parameter --name "$PARAMETER_PREFIX/public-key" --type String --overwrite --value "file://$certificate" > /dev/null
            aws ssm put-parameter --name "$PARAMETER_PREFIX/key-id" --type String --overwrite --value "$key_id" > /dev/null
            echo "Published signing key ${key_id} (was ${published_id}) to ${PARAMETER_PREFIX}" >> "$GITHUB_STEP_SUMMARY"
          fi
          gpg --batch --import "$certificate"
          echo "Signing with KMS key ${key_id}" >> "$GITHUB_STEP_SUMMARY"

      - name: Release with GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the promoted checksums
        if: github.event_name == 'workflow_dispatch'
        working-directory: dist
        run: |
          set -euo pipefail
          prefix="terraform-provider-webbpulse_${TAG#v}"
          kms-openpgp sign -key "$SIGNING_KMS_KEY_ID" -output "${prefix}_SHA256SUMS.sig" "${prefix}_SHA256SUMS"

      - name: Verify the signed checksums
        working-directory: dist
        run: |
          set -euo pipefail
          prefix="terraform-provider-webbpulse_${TAG#v}"
          if [ ! -f "${prefix}_manifest.json" ]; then
            cp ../terraform-registry-manifest.json "${prefix}_manifest.json"
          fi
          gpg --batch --verify "${prefix}_SHA256SUMS.sig" "${prefix}_SHA256SUMS"
          sha256sum --check --strict "${prefix}_SHA256SUMS"

      - name: Keep the checksummed build for promotion
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/terraform-provider-webbpulse_*.zip
            dist/terraform-provider-webbpulse_*_SHA256SUMS
            dist/terraform-provider-webbpulse_*_manifest.json

      - name: Upload the signed build to the registry
        if: env.UPLOAD_BUCKET != ''
        working-directory: dist
        env:
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prefix="terraform-provider-webbpulse_${version}"
          folder="s3://${UPLOAD_BUCKET}/registry/provider-uploads/webbpulse/webbpulse/${version}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          sse=(--sse aws:kms --sse-kms-key-id "$UPLOAD_KMS_KEY_ARN" --only-show-errors)
          for file in "${prefix}"_*.zip "${prefix}_SHA256SUMS" "${prefix}_SHA256SUMS.sig" "${prefix}_manifest.json"; do
            aws s3 cp "$file" "${folder}${file}" "${sse[@]}"
          done
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg tag "$TAG" --arg actor "$ACTOR" --arg run_url "$RUN_URL" \
            '{repository: $repository, tag: $tag, actor: $actor, run_url: $run_url}' > upload.json
          aws s3 cp upload.json "${folder}upload.json" "${sse[@]}" --content-type application/json
          echo "Uploaded ${TAG} to ${folder}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the verification keyring
        if: always()
        run: |
          gpgconf --kill all || true
          rm -rf "$GNUPGHOME"
