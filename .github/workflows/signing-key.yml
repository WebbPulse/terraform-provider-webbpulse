name: signing-key

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose release signing key is generated
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: signing-key-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate the ${{ inputs.environment }} signing key
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-signing-key
    permissions:
      contents: read
      id-token: write
    env:
      SECRET_ID: ${{ vars.SIGNING_KEY_SECRET_ID }}
      PARAMETER_PREFIX: ${{ vars.SIGNING_KEY_PARAMETER_PREFIX }}
      KEY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Assume the key generation role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.SIGNING_KEY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Refuse to replace an existing key
        run: |
          versions="$(aws secretsmanager describe-secret --secret-id "$SECRET_ID" --query VersionIdsToStages --output json | jq 'length')"
          if [ "$versions" != "0" ]; then
            echo "::error::The $KEY_ENVIRONMENT signing key secret already holds a version. Rotation is a deliberate change, not a rerun."
            exit 1
          fi

      - name: Generate the key and store it
        run: |
          set -euo pipefail
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME" "$RUNNER_TEMP/private.asc"' EXIT
          gpg --batch --gen-key <<PARAMS
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: WebbPulse Terraform provider ${KEY_ENVIRONMENT}
          Name-Email: tyler@webbpulse.com
          Expire-Date: 0
          %commit
          PARAMS
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          key_id="${fingerprint: -16}"
          gpg --batch --armor --export-secret-keys "$fingerprint" > "$RUNNER_TEMP/private.asc"
          aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "file://$RUNNER_TEMP/private.asc" --query VersionId --output text > /dev/null
          gpg --batch --armor --export "$fingerprint" > "$RUNNER_TEMP/public.asc"
          aws ssm put-parameter --name "$PARAMETER_PREFIX/public-key" --type String --overwrite --value "file://$RUNNER_TEMP/public.asc" > /dev/null
          aws ssm put-parameter --name "$PARAMETER_PREFIX/key-id" --type String --overwrite --value "$key_id" > /dev/null
          {
            echo "### $KEY_ENVIRONMENT provider signing key"
            echo
            echo "- Fingerprint: \`$fingerprint\`"
            echo "- Key id: \`$key_id\`"
            echo "- Public key: \`$PARAMETER_PREFIX/public-key\`"
          } >> "$GITHUB_STEP_SUMMARY"
